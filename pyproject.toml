[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse2solid"
version = "0.1.0"
description = "Few-image sparse-view architectural 3D reconstruction into clean solid models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthew McCoy" }]
dependencies = [
  "flask>=3.0",
  "numpy>=1.24",
  "pillow>=10.0"
]

[project.optional-dependencies]
video = ["imageio>=2.34"]
dev = ["pytest>=8.0"]

[project.scripts]
sparse2solid-plan = "sparse2solid.reference_planner:main"
sparse2solid-demo = "sparse2solid.demo:main"
sparse2solid-orbit = "sparse2solid.orbit:main"
sparse2solid-gui = "sparse2solid.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
